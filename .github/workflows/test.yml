name: Test

on:
  push:
  pull_request:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 22

      - name: Install NPM dependencies
        run: npm ci

      - name: Lint the workflows
        run: npm run lint

  zip:
    name: Zip smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 22

      - name: Install NPM dependencies
        run: npm ci

      # Sanity check: the release packaging must work from the repo root
      # and the deploy directory holds the distributed files with a
      # converted readme.txt.
      - name: Zip
        run: npm run zip

      - name: Verify the readme conversion
        run: |
          test -f dist/readme.txt
          grep -q '^== Changelog ==$' dist/readme.txt
          # The changelog marker is for the repository readme only.
          ! grep -q 'changelog -->' dist/readme.txt
          grep -q '^Stable tag:' dist/readme.txt

      - name: Verify the ZIP
        run: |
          test -f widget-output-cache.*.zip
          unzip -l widget-output-cache.*.zip 'widget-output-cache/widget-output-cache.php'
          # The checksums manifest comes from the `integrity` settings of
          # wp-release.config.mjs and is embedded at the package root.
          unzip -l widget-output-cache.*.zip 'widget-output-cache/checksums.json'
          npx wp-release verify --zip widget-output-cache.*.zip --checksums-file checksums.json

  # A pull request that changed the package needs a changeset, either with
  # a release note or an empty one for an explicit no-release decision.
  changeset:
    name: Check the changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The comparison needs the base branch history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 22

      - name: Install NPM dependencies
        run: npm ci

      - name: Changeset status
        run: npx --no-install wp-release changeset-status --since "origin/${{ github.base_ref }}"
