name: Test

on:
  push:
  pull_request:

jobs:

  zip:
    name: Zip smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: .nvmrc

      - name: Install NPM dependencies
        run: npm ci

      # Sanity check: the release packaging must work straight from the
      # repo root, which holds the distributed plugin files, including the
      # checked-in readme.txt and the translation files, selected by
      # .distignore.
      - name: Zip
        run: npm run zip

      - name: Verify the ZIP
        run: |
          test -f widget-output-cache.*.zip
          unzip -l widget-output-cache.*.zip 'widget-output-cache/widget-output-cache.php'
          unzip -l widget-output-cache.*.zip 'widget-output-cache/readme.txt'
          # The readme is the WordPress.org format; the developer readme
          # markdown stays out of the ZIP.
          ! unzip -l widget-output-cache.*.zip 'widget-output-cache/README.md'
          # The checksums manifest comes from the `integrity` settings of
          # wp-release.config.mjs and is embedded at the package root,
          # covering the readme too.
          unzip -l widget-output-cache.*.zip 'widget-output-cache/checksums.json'
          npx wp-release verify --zip widget-output-cache.*.zip --checksums-file checksums.json

  # A pull request that changed the package needs a changeset, either with
  # a release note or an empty one for an explicit no-release decision.
  changeset:
    name: Check the changeset
    # Automated release PRs (branches starting with `release/`) consume
    # their pending changesets by design, so a newly added changeset can
    # never satisfy the gate.
    if: github.event_name == 'pull_request' && ! startsWith( github.head_ref, 'release/' )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The comparison needs the base branch history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: .nvmrc

      - name: Install NPM dependencies
        run: npm ci

      - name: Changeset status
        run: npx --no-install wp-release changeset-status --since "origin/${{ github.base_ref }}"
