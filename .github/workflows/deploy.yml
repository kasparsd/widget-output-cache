name: Deploy to WordPress.org

on:
  release:
    types: [ published ]
  push:
    branches: [ master ]

permissions:
  contents: write

# Only one SVN deploy at a time.
concurrency: wporg-deploy

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: .nvmrc

      - name: Install NPM dependencies
        run: npm ci

      # GitHub's Ubuntu runners don't include the svn client that
      # wp-release needs to deploy.
      - name: Install Subversion
        run: |
          if command -v svn >/dev/null 2>&1; then
            echo "Subversion is already installed."
          else
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends subversion
          fi

      # Package the release with the checksums manifest from the
      # `integrity` settings of wp-release.config.mjs embedded at the
      # package root of the ZIP, so the wp.org build, the release ZIP and
      # any installed copy can be verified against the same manifest.
      # Signing is deferred.
      - name: Package the release
        if: github.event_name == 'release'
        run: npm run zip

      # Attach the ZIP to the GitHub release (pre-releases included). The
      # checksums manifest is embedded in the ZIP itself.
      - name: Attach release artifact
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" widget-output-cache.*.zip --clobber

      # Stable releases: deploy exactly the files of the release ZIP to
      # tags/<version> and update the assets. Trunk is left alone: the
      # development copy on wp.org is no longer kept in sync from master
      # (previously each stable release synced the build to trunk as
      # well). The deploy validates that the Version header and the readme
      # stable tag match the SVN tag before writing anything. A leading
      # "v" in the tag name is stripped by wp-release, and release tags
      # must not carry a "v" prefix, which is also what the WordPress.org
      # tags look like.
      - name: Deploy stable release to WordPress.org
        if: github.event_name == 'release' && ! github.event.release.prerelease
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip widget-output-cache.*.zip --slug widget-output-cache --svn-tag "$GITHUB_REF_NAME"

      # Pre-releases: create tags/<version> from the release ZIP and leave
      # trunk alone. Pre-release versions like 0.6.0-rc.1 are never
      # installed as updates by WordPress.org, so the stable tag in the
      # readme keeps serving the last stable release.
      - name: Deploy pre-release to WordPress.org
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip widget-output-cache.*.zip --slug widget-output-cache --svn-tag "$GITHUB_REF_NAME"

      # Pushes to master: update the wp.org trunk readme between releases,
      # for example when bumping "Tested up to" or adding changelog
      # entries. The readme lives in the repository as readme.txt, so the
      # deploy reads it straight from the repo root. Trunk only ever
      # receives the readme; the rest of trunk stays at the last tagged
      # build. No SVN credentials are needed unless something changed on
      # the server.
      - name: Update the WordPress.org readme
        if: github.event_name == 'push'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn . --slug widget-output-cache --readme-only
